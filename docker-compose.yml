services:

  # ─── PostgreSQL: Transaction Service (port 5433) ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wisewallet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Account Service (port 5432) ─────────────────────────────────
  postgres-account:
    image: postgres:16-alpine
    container_name: wisewallet-postgres-account
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: account_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Notification + Advisor Services (port 5435) ─────────────────
  postgres-notif-advisor:
    image: postgres:16-alpine
    container_name: wisewallet-postgres-notif-advisor
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_MULTIPLE_DATABASES: "notification_db,wisewallet_advisor"
    ports:
      - "5435:5432"
    volumes:
      - postgres_notif_advisor_data:/var/lib/postgresql/data
      - ./docker/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka (KRaft mode, no ZooKeeper) ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: wisewallet-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Transaction Service ─────────────────────────────────────────────────────
  transaction-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wisewallet-transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_API_KEY: dev-internal-api-key
      ACCOUNT_SERVICE_URL: http://host.docker.internal:8081
      MANAGEMENT_PORT: 8092
      OTEL_SDK_DISABLED: "true"
    ports:
      - "8082:8082"
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Uncomment to override the profile and run without the full Docker build:
    # profiles: ["full"]

volumes:
  postgres_data:
  postgres_account_data:
  postgres_notif_advisor_data:
