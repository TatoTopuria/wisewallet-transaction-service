spring:
  application:
    name: transaction-service
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transaction
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: transaction
    liquibase-schema: public
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10

server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: never

management:
  server:
    port: ${MANAGEMENT_PORT:8092}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

wisewallet:
  internal:
    api-key: ${INTERNAL_API_KEY}
    jwt:
      secret: ${INTERNAL_JWT_SECRET}
  transaction:
    outbox:
      poll-fixed-delay-ms: 2000
      batch-size: 50
      max-retries: 5
    idempotency:
      ttl-hours: 48
      cleanup-cron: "0 0 * * * *"
    kafka:
      topics:
        txn-created: txn.created
        txn-categorized: txn.categorized
        txn-compensation: txn.compensation
      compensation-consumer-group: txn-compensation-group
    pagination:
      default-page-size: 10
    saga:
      feign-retry-attempts: 3
      feign-retry-backoff-ms: 100

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        recordExceptions:
          - feign.FeignException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException.UnprocessableEntity
  retry:
    instances:
      accountServiceRetry:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.FeignException.Conflict
          - java.io.IOException
      accountServiceCommit:
        maxAttempts: 5
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.FeignException.Conflict
          - java.io.IOException
      accountServiceRelease:
        maxAttempts: 5
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - feign.FeignException.Conflict
          - java.io.IOException

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

spring:
  cloud:
    openfeign:
      client:
        config:
          accountServiceFeignClient:
            connectTimeout: 2000
            readTimeout: 5000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.wisewallet: INFO
