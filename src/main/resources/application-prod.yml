spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  cloud:
    aws:
      secretsmanager:
        enabled: true
        region: ${AWS_REGION:eu-west-1}

logging:
  level:
    com.wisewallet: WARN
